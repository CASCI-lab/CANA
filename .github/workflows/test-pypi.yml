name: TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing Git tag to test"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools-scm

      - name: Determine version
        id: version
        run: |
          VERSION=$(python -m setuptools_scm)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify tag version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${{ inputs.ref }}"
          TAG_VERSION="${TAG_VERSION#v}"

          echo "Git tag version: $TAG_VERSION"
          echo "Package version: $VERSION"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Build package
        run: |
          python -m build

      - name: Show artifacts
        run: |
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    # This environment name must match the environment registered
    # in the TestPyPI Trusted Publisher configuration.
    environment: testpypi

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/